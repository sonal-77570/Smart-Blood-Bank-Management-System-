<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Blood Bank Management System</title>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--text:#1f2433;--muted:#6b7280;--line:#e5e7eb;
  --red:#d6213a;--red2:#ff4d6d;--green:#12a150;--amber:#e8a100;--blue:#2563eb;
  --shadow:0 6px 24px rgba(20,20,50,.07);--side:#1b1f2e;
}
[data-theme=dark]{
  --bg:#0f1220;--card:#181c2e;--text:#eceefb;--muted:#9aa1b9;--line:#2a2f48;
  --shadow:0 6px 24px rgba(0,0,0,.4);--side:#0b0d18;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at 20% 20%,#ff4d6d55,transparent 40%),radial-gradient(circle at 80% 80%,#d6213a55,transparent 45%),linear-gradient(135deg,#1b1f2e,#2b1020)}
.login-box{background:var(--card);width:100%;max-width:400px;padding:36px 32px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.drop{font-size:54px;animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.login-box h1{font-size:22px;margin:8px 0 4px}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:22px}
.hint{margin-top:16px;font-size:12px;color:var(--muted)}

/* ---------- Form controls ---------- */
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);outline:none;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #d6213a22}
.field .err{color:var(--red);font-size:12px;margin-top:4px;display:none}
.field.bad input,.field.bad select{border-color:var(--red)}
.field.bad .err{display:block}
.btn{border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 6px 16px #d6213a44}
.btn-primary:hover{transform:translateY(-1px)}
.btn-light{background:var(--bg);border:1px solid var(--line)}
.btn-light:hover{border-color:var(--red);color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn-danger{background:#d6213a18;color:var(--red)}
.btn-ok{background:#12a15018;color:var(--green)}
.btn-block{width:100%;justify-content:center}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
aside{width:250px;background:var(--side);color:#c9cde0;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;transition:.3s}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:4px 10px 22px}
.brand span.d{font-size:28px}
.brand small{display:block;font-weight:400;font-size:11px;color:#8a90aa}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:inherit;text-decoration:none;cursor:pointer;margin-bottom:4px;transition:.2s}
.nav a:hover{background:#ffffff12;color:#fff}
.nav a.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 6px 16px #d6213a55}
.nav .ic{width:22px;text-align:center}
main{flex:1;min-width:0}
header.top{display:flex;align-items:center;gap:12px;padding:16px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top h2{font-size:20px;flex:1}
.burger{display:none}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;display:grid;place-items:center;font-weight:700}
#view{padding:26px 28px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Cards / tables ---------- */
.grid{display:grid;gap:18px}
.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:22px}
.stat{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.stat .ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:24px}
.stat h3{font-size:26px;line-height:1}
.stat p{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card h3{font-size:16px;margin-bottom:14px}
.two{grid-template-columns:2fr 1fr}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar .search{flex:1;min-width:200px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);outline:none}
.toolbar .search:focus{border-color:var(--red)}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--bg);text-align:left;padding:12px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);white-space:nowrap}
tr:hover td{background:#d6213a08}
.empty{text-align:center;color:var(--muted);padding:34px}
.badge{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.bg{background:#d6213a18;color:var(--red)}
.b-pending{background:#e8a10020;color:var(--amber)}
.b-approved{background:#2563eb20;color:var(--blue)}
.b-issued{background:#12a15020;color:var(--green)}
.b-rejected{background:#6b728025;color:var(--muted)}
.actions{display:flex;gap:6px}

/* ---------- Blood bags ---------- */
.bags{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.bag{background:var(--card);border-radius:16px;padding:18px;text-align:center;box-shadow:var(--shadow);position:relative;transition:.2s}
.bag:hover{transform:translateY(-4px)}
.bag .type{font-size:24px;font-weight:800;color:var(--red)}
.bag .units{font-size:30px;font-weight:800;margin:4px 0}
.bag small{color:var(--muted)}
.meter{height:8px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--red),var(--red2));transition:width .8s}
.bag.low{outline:2px dashed var(--amber)}
.bag .tag{position:absolute;top:8px;right:8px;font-size:10px;background:var(--amber);color:#fff;padding:2px 7px;border-radius:10px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar-row b{width:34px}
.bar-row .meter{flex:1;margin:0;height:12px}
.bar-row span{width:36px;text-align:right;color:var(--muted)}
.feed li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:10px}
.feed li:last-child{border:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
pre{background:#10131f;color:#a5f3c3;padding:18px;border-radius:12px;overflow:auto;font-size:12.5px;line-height:1.5;max-height:460px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}

/* ---------- Modal / toast ---------- */
#modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:100;padding:16px;backdrop-filter:blur(3px)}
.modal-box{background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:26px;animation:pop .25s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.modal-box h3{margin-bottom:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#1f2433;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 8px 24px #0005;animation:pop .3s;border-left:5px solid var(--green)}
.toast.err{border-color:var(--red)}

@media(max-width:900px){
  aside{position:fixed;z-index:50;left:-260px}
  aside.open{left:0}
  .burger{display:inline-flex}
  .two{grid-template-columns:1fr}
  #view{padding:18px 14px}
  header.top{padding:12px 14px}
}
@media print{aside,header.top,.toolbar,.tabs,.no-print{display:none!important}#view{padding:0}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login">
  <form class="login-box" id="loginForm" autocomplete="off">
    <div class="drop">🩸</div>
    <h1>Smart Blood Bank</h1>
    <p>Management System · Administrator Login</p>
    <div class="field"><label>Username</label><input id="lu" placeholder="Enter username" required></div>
    <div class="field"><label>Password</label><input id="lp" type="password" placeholder="Enter password" required></div>
    <button class="btn btn-primary btn-block" type="submit">Sign In →</button>
    <div class="hint">Demo login: <b>admin</b> / <b>admin123</b></div>
  </form>
</section>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><span class="d">🩸</span><div>Smart Blood Bank<small>Management System</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <header class="top">
      <button class="btn btn-light burger" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h2 id="title">Dashboard</h2>
      <button class="btn btn-light btn-sm" id="themeBtn">🌙</button>
      <div class="avatar">A</div>
      <button class="btn btn-light btn-sm" id="logout">Logout</button>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modal" class="hidden"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   DATABASE LAYER  (tables follow Chapter 2.3 of the project report)
   Stored in localStorage -> acts like a small relational database
   ===================================================================== */
const GROUPS=['A+','A-','B+','B-','AB+','AB-','O+','O-'];
const KEY='sbbms_db_v1';
let mem=null;

const SQL_SCHEMA=`-- Smart Blood Bank Management System : MySQL schema
CREATE DATABASE IF NOT EXISTS blood_bank;
USE blood_bank;

CREATE TABLE Admin (
  Admin_ID   INT AUTO_INCREMENT PRIMARY KEY,
  Username   VARCHAR(50)  NOT NULL UNIQUE,
  Password   VARCHAR(100) NOT NULL
);

CREATE TABLE Donor (
  Donor_ID    INT AUTO_INCREMENT PRIMARY KEY,
  Name        VARCHAR(100) NOT NULL,
  Age         INT          NOT NULL CHECK (Age BETWEEN 18 AND 65),
  Gender      VARCHAR(10)  NOT NULL,
  Blood_Group VARCHAR(5)   NOT NULL,
  Contact     VARCHAR(15)  NOT NULL,
  Address     VARCHAR(200)
);

CREATE TABLE Blood_Collection (
  Collection_ID   INT AUTO_INCREMENT PRIMARY KEY,
  Donor_ID        INT         NOT NULL,
  Blood_Group     VARCHAR(5)  NOT NULL,
  Quantity        INT         NOT NULL,
  Collection_Date DATE        NOT NULL,
  FOREIGN KEY (Donor_ID) REFERENCES Donor(Donor_ID)
);

CREATE TABLE Blood_Inventory (
  Stock_ID        INT AUTO_INCREMENT PRIMARY KEY,
  Blood_Group     VARCHAR(5) NOT NULL UNIQUE,
  Available_Units INT        NOT NULL DEFAULT 0
);

CREATE TABLE Blood_Request (
  Request_ID   INT AUTO_INCREMENT PRIMARY KEY,
  Patient_Name VARCHAR(100) NOT NULL,
  Blood_Group  VARCHAR(5)   NOT NULL,
  Quantity     INT          NOT NULL,
  Request_Date DATE         NOT NULL,
  Status       VARCHAR(15)  DEFAULT 'Pending'   -- Pending / Approved / Rejected / Issued
);

CREATE TABLE Blood_Issue (
  Issue_ID    INT AUTO_INCREMENT PRIMARY KEY,
  Request_ID  INT        NOT NULL,
  Blood_Group VARCHAR(5) NOT NULL,
  Quantity    INT        NOT NULL,
  Issue_Date  DATE       NOT NULL,
  FOREIGN KEY (Request_ID) REFERENCES Blood_Request(Request_ID)
);

-- Triggers that mirror the application logic
DELIMITER //
CREATE TRIGGER trg_collection AFTER INSERT ON Blood_Collection
FOR EACH ROW UPDATE Blood_Inventory
  SET Available_Units = Available_Units + NEW.Quantity
  WHERE Blood_Group = NEW.Blood_Group//

CREATE TRIGGER trg_issue AFTER INSERT ON Blood_Issue
FOR EACH ROW BEGIN
  UPDATE Blood_Inventory SET Available_Units = Available_Units - NEW.Quantity
    WHERE Blood_Group = NEW.Blood_Group;
  UPDATE Blood_Request SET Status='Issued' WHERE Request_ID = NEW.Request_ID;
END//
DELIMITER ;

INSERT INTO Admin (Username,Password) VALUES ('admin','admin123');
INSERT INTO Blood_Inventory (Blood_Group) VALUES
 ('A+'),('A-'),('B+'),('B-'),('AB+'),('AB-'),('O+'),('O-');`;

const today=()=>new Date().toISOString().slice(0,10);
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};

function seed(){
  const d={
    admin:[{Admin_ID:1,Username:'admin',Password:'admin123'}],
    donor:[
      {Donor_ID:1,Name:'Rahul Patil',Age:28,Gender:'Male',Blood_Group:'O+',Contact:'9876501234',Address:'Junnar, Pune'},
      {Donor_ID:2,Name:'Priya Kulkarni',Age:25,Gender:'Female',Blood_Group:'A+',Contact:'9823012345',Address:'Narayangaon, Pune'},
      {Donor_ID:3,Name:'Amit Deshmukh',Age:34,Gender:'Male',Blood_Group:'B+',Contact:'9922334455',Address:'Vadgaon Sahani'},
      {Donor_ID:4,Name:'Sneha Jadhav',Age:30,Gender:'Female',Blood_Group:'AB+',Contact:'9765432109',Address:'Otur, Pune'},
      {Donor_ID:5,Name:'Vikas More',Age:41,Gender:'Male',Blood_Group:'O-',Contact:'9011223344',Address:'Alephata, Pune'}
    ],
    collection:[
      {Collection_ID:1,Donor_ID:1,Blood_Group:'O+',Quantity:2,Collection_Date:daysAgo(9)},
      {Collection_ID:2,Donor_ID:2,Blood_Group:'A+',Quantity:1,Collection_Date:daysAgo(6)},
      {Collection_ID:3,Donor_ID:3,Blood_Group:'B+',Quantity:2,Collection_Date:daysAgo(4)},
      {Collection_ID:4,Donor_ID:4,Blood_Group:'AB+',Quantity:1,Collection_Date:daysAgo(2)},
      {Collection_ID:5,Donor_ID:5,Blood_Group:'O-',Quantity:3,Collection_Date:daysAgo(1)}
    ],
    inventory:GROUPS.map((g,i)=>({Stock_ID:i+1,Blood_Group:g,Available_Units:0})),
    request:[
      {Request_ID:1,Patient_Name:'Ganesh Shinde',Blood_Group:'O+',Quantity:1,Request_Date:daysAgo(3),Status:'Approved'},
      {Request_ID:2,Patient_Name:'Meera Pawar',Blood_Group:'A-',Quantity:2,Request_Date:daysAgo(1),Status:'Pending'}
    ],
    issue:[]
  };
  d.collection.forEach(c=>{d.inventory.find(i=>i.Blood_Group===c.Blood_Group).Available_Units+=c.Quantity});
  return d;
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
  return mem||seed();
}
let DB=load();
function save(){mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
save();
const nextId=(t,k)=>DB[t].reduce((m,r)=>Math.max(m,r[k]),0)+1;
const stock=g=>DB.inventory.find(i=>i.Blood_Group===g);
const donorName=id=>(DB.donor.find(d=>d.Donor_ID==id)||{}).Name||'—';

/* =====================================================================
   UI HELPERS
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg,err){
  const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200);
}
function openModal(html){const m=$('#modal');m.innerHTML=`<div class="modal-box">${html}</div>`;m.classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});

function confirmBox(msg,cb){
  openModal(`<h3>Please confirm</h3><p style="margin-bottom:18px">${msg}</p>
  <div class="modal-foot"><button class="btn btn-light" onclick="closeModal()">Cancel</button>
  <button class="btn btn-primary" id="yes">Yes, continue</button></div>`);
  $('#yes').onclick=()=>{closeModal();cb()};
}
const groupOpts=sel=>`<option value="">Select</option>`+GROUPS.map(g=>`<option ${g===sel?'selected':''}>${g}</option>`).join('');
const statusBadge=s=>`<span class="badge b-${s.toLowerCase()}">${s}</span>`;

function validate(form,rules){
  let ok=true;
  for(const [name,fn] of Object.entries(rules)){
    const el=form.elements[name],box=el.closest('.field');
    const msg=fn(el.value.trim());
    box.classList.toggle('bad',!!msg);
    if(msg){box.querySelector('.err').textContent=msg;ok=false}
  }
  return ok;
}
const F=(label,name,input)=>`<div class="field"><label>${label}</label>${input}<div class="err"></div></div>`;

function toCSV(rows){
  if(!rows.length)return'';
  const k=Object.keys(rows[0]);
  return [k.join(','),...rows.map(r=>k.map(c=>`"${String(r[c]).replace(/"/g,'""')}"`).join(','))].join('\n');
}
function download(name,text,type='text/csv'){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
}

/* =====================================================================
   PAGES
   ===================================================================== */
const PAGES=[
  {id:'dashboard',label:'Dashboard',ic:'📊'},
  {id:'register',label:'Donor Registration',ic:'📝'},
  {id:'donors',label:'Donor Management',ic:'👥'},
  {id:'collection',label:'Blood Collection',ic:'💉'},
  {id:'inventory',label:'Blood Inventory',ic:'🧪'},
  {id:'requests',label:'Blood Requests',ic:'📨'},
  {id:'issue',label:'Blood Issue',ic:'🏥'},
  {id:'reports',label:'Reports',ic:'📑'},
  {id:'database',label:'Database',ic:'🗄️'}
];
let current='dashboard';

function buildNav(){
  $('#nav').innerHTML=PAGES.map(p=>`<a data-p="${p.id}" class="${p.id===current?'active':''}"><span class="ic">${p.ic}</span>${p.label}</a>`).join('');
  $('#nav').onclick=e=>{const a=e.target.closest('a');if(a)go(a.dataset.p)};
}
function go(p){
  current=p;buildNav();
  $('#title').textContent=PAGES.find(x=>x.id===p).label;
  $('#side').classList.remove('open');
  const v=$('#view');v.style.animation='none';void v.offsetWidth;v.style.animation='';
  ({dashboard,register,donors,collection,inventory,requests,issue,reports,database})[p]();
  window.scrollTo(0,0);
}

/* ---------- Dashboard ---------- */
function dashboard(){
  const total=DB.inventory.reduce((s,i)=>s+i.Available_Units,0);
  const collected=DB.collection.reduce((s,c)=>s+c.Quantity,0);
  const pending=DB.request.filter(r=>r.Status==='Pending').length;
  const issued=DB.issue.reduce((s,i)=>s+i.Quantity,0);
  const max=Math.max(10,...DB.inventory.map(i=>i.Available_Units));
  const feed=[
    ...DB.collection.map(c=>({d:c.Collection_Date,t:`💉 ${esc(donorName(c.Donor_ID))} donated ${c.Quantity} unit(s) of ${c.Blood_Group}`})),
    ...DB.request.map(r=>({d:r.Request_Date,t:`📨 ${esc(r.Patient_Name)} requested ${r.Quantity} unit(s) of ${r.Blood_Group}`})),
    ...DB.issue.map(i=>({d:i.Issue_Date,t:`🏥 Issued ${i.Quantity} unit(s) of ${i.Blood_Group} (Request #${i.Request_ID})`}))
  ].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,7);
  const st=(ic,bg,n,l)=>`<div class="stat"><div class="ico" style="background:${bg}">${ic}</div><div><h3 data-count="${n}">0</h3><p>${l}</p></div></div>`;
  $('#view').innerHTML=`
  <div class="grid stats">
    ${st('👥','#d6213a18',DB.donor.length,'Registered Donors')}
    ${st('🩸','#12a15018',total,'Available Blood Units')}
    ${st('💉','#2563eb18',collected,'Total Units Collected')}
    ${st('⏳','#e8a10020',pending,'Pending Requests')}
    ${st('🏥','#7c3aed18',issued,'Units Issued')}
  </div>
  <div class="grid two">
    <div class="card"><h3>Blood Group-wise Stock</h3>
      ${DB.inventory.map(i=>`<div class="bar-row"><b>${i.Blood_Group}</b><div class="meter"><i style="width:${i.Available_Units/max*100}%"></i></div><span>${i.Available_Units}</span></div>`).join('')}
    </div>
    <div class="card"><h3>Recent Activity</h3>
      <ul class="feed">${feed.length?feed.map(f=>`<li><div>${f.t}<br><small style="color:var(--muted)">${f.d}</small></div></li>`).join(''):'<div class="empty">No activity yet</div>'}</ul>
    </div>
  </div>
  ${DB.inventory.some(i=>i.Available_Units<3)?`<div class="card" style="margin-top:18px;border-left:5px solid var(--amber)"><h3>⚠️ Low Stock Alert</h3>
   <p>${DB.inventory.filter(i=>i.Available_Units<3).map(i=>`<span class="badge bg" style="margin-right:6px">${i.Blood_Group}: ${i.Available_Units}</span>`).join('')}</p></div>`:''}`;
  document.querySelectorAll('[data-count]').forEach(el=>{
    const n=+el.dataset.count;let c=0;const step=Math.max(1,Math.ceil(n/30));
    const t=setInterval(()=>{c=Math.min(n,c+step);el.textContent=c;if(c>=n)clearInterval(t)},25);
  });
}

/* ---------- Donor Registration ---------- */
function donorForm(d={}){
  return `
  <div class="form-grid">
    ${F('Full Name','name',`<input name="name" value="${esc(d.Name)}" placeholder="Donor name">`)}
    ${F('Age (18-65)','age',`<input name="age" type="number" value="${d.Age||''}" placeholder="Age">`)}
    ${F('Gender','gender',`<select name="gender"><option value="">Select</option>${['Male','Female','Other'].map(g=>`<option ${g===d.Gender?'selected':''}>${g}</option>`).join('')}</select>`)}
    ${F('Blood Group','bg',`<select name="bg">${groupOpts(d.Blood_Group)}</select>`)}
    ${F('Contact Number','contact',`<input name="contact" value="${esc(d.Contact)}" placeholder="10-digit mobile">`)}
    ${F('Address','address',`<input name="address" value="${esc(d.Address)}" placeholder="Address">`)}
  </div>`;
}
const donorRules={
  name:v=>v.length<3?'Enter a valid name':'',
  age:v=>(+v<18||+v>65)?'Age must be between 18 and 65':'',
  gender:v=>!v?'Select gender':'',
  bg:v=>!v?'Select blood group':'',
  contact:v=>!/^[6-9]\d{9}$/.test(v)?'Enter a valid 10-digit number':'',
  address:v=>!v?'Address is required':''
};
function register(){
  $('#view').innerHTML=`<div class="card" style="max-width:820px"><h3>Register New Donor</h3>
  <form id="f" novalidate>${donorForm()}<button class="btn btn-primary" type="submit">Register Donor</button></form></div>`;
  $('#f').onsubmit=e=>{
    e.preventDefault();const f=e.target;
    if(!validate(f,donorRules))return;
    if(DB.donor.some(d=>d.Contact===f.contact.value.trim()))return toast('A donor with this contact already exists',true);
    DB.donor.push({Donor_ID:nextId('donor','Donor_ID'),Name:f.name.value.trim(),Age:+f.age.value,Gender:f.gender.value,
      Blood_Group:f.bg.value,Contact:f.contact.value.trim(),Address:f.address.value.trim()});
    save();toast('Donor registered successfully ✔');go('donors');
  };
}

/* ---------- Donor Management ---------- */
function donors(){
  $('#view').innerHTML=`<div class="toolbar">
    <input class="search" id="q" placeholder="🔍 Search by name, blood group, contact, address...">
    <select id="gf" class="search" style="flex:0;min-width:140px"><option value="">All groups</option>${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select>
    <button class="btn btn-primary" onclick="go('register')">+ Add Donor</button></div>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Blood</th><th>Contact</th><th>Address</th><th>Donations</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw=()=>{
    const q=$('#q').value.toLowerCase(),g=$('#gf').value;
    const rows=DB.donor.filter(d=>(!g||d.Blood_Group===g)&&Object.values(d).join(' ').toLowerCase().includes(q));
    $('#tb').innerHTML=rows.length?rows.map(d=>`<tr><td>${d.Donor_ID}</td><td><b>${esc(d.Name)}</b></td><td>${d.Age}</td><td>${d.Gender}</td>
      <td><span class="badge bg">${d.Blood_Group}</span></td><td>${esc(d.Contact)}</td><td>${esc(d.Address)}</td>
      <td>${DB.collection.filter(c=>c.Donor_ID===d.Donor_ID).length}</td>
      <td class="actions"><button class="btn btn-light btn-sm" onclick="editDonor(${d.Donor_ID})">✏️ Edit</button>
      <button class="btn btn-danger btn-sm" onclick="delDonor(${d.Donor_ID})">🗑 Delete</button></td></tr>`).join(''):`<tr><td colspan="9" class="empty">No donors found</td></tr>`;
  };
  $('#q').oninput=draw;$('#gf').onchange=draw;draw();
}
function editDonor(id){
  const d=DB.donor.find(x=>x.Donor_ID===id);
  openModal(`<h3>Edit Donor #${id}</h3><form id="ef" novalidate>${donorForm(d)}
   <div class="modal-foot"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary">Save Changes</button></div></form>`);
  $('#ef').onsubmit=e=>{
    e.preventDefault();const f=e.target;if(!validate(f,donorRules))return;
    Object.assign(d,{Name:f.name.value.trim(),Age:+f.age.value,Gender:f.gender.value,Blood_Group:f.bg.value,Contact:f.contact.value.trim(),Address:f.address.value.trim()});
    save();closeModal();toast('Donor updated ✔');donors();
  };
}
function delDonor(id){
  if(DB.collection.some(c=>c.Donor_ID===id))return toast('Cannot delete: donor has blood collection records',true);
  confirmBox('Delete this donor permanently?',()=>{DB.donor=DB.donor.filter(d=>d.Donor_ID!==id);save();toast('Donor deleted');donors()});
}

/* ---------- Blood Collection ---------- */
function collection(){
  $('#view').innerHTML=`<div class="grid two">
  <div class="card"><h3>Record Blood Collection</h3>
   <form id="f" novalidate>
    ${F('Donor','donor',`<select name="donor"><option value="">Select donor</option>${DB.donor.map(d=>`<option value="${d.Donor_ID}">#${d.Donor_ID} · ${esc(d.Name)} (${d.Blood_Group})</option>`).join('')}</select>`)}
    ${F('Blood Group (auto)','bg',`<input name="bg" readonly placeholder="Auto-filled from donor">`)}
    ${F('Quantity (units, 1-5)','qty',`<input name="qty" type="number" min="1" max="5" value="1">`)}
    ${F('Collection Date','date',`<input name="date" type="date" value="${today()}" max="${today()}">`)}
    <button class="btn btn-primary btn-block">Save Collection</button>
   </form></div>
  <div class="card"><h3>Collection History</h3>${table(
    ['ID','Donor','Group','Units','Date'],
    [...DB.collection].reverse().map(c=>[c.Collection_ID,esc(donorName(c.Donor_ID)),`<span class="badge bg">${c.Blood_Group}</span>`,c.Quantity,c.Collection_Date]))}</div></div>`;
  const f=$('#f');
  f.donor.onchange=()=>{const d=DB.donor.find(x=>x.Donor_ID==f.donor.value);f.bg.value=d?d.Blood_Group:''};
  f.onsubmit=e=>{
    e.preventDefault();
    if(!validate(f,{donor:v=>!v?'Select a donor':'',qty:v=>(+v<1||+v>5)?'Enter 1 to 5 units':'',date:v=>!v?'Select date':''}))return;
    DB.collection.push({Collection_ID:nextId('collection','Collection_ID'),Donor_ID:+f.donor.value,Blood_Group:f.bg.value,Quantity:+f.qty.value,Collection_Date:f.date.value});
    stock(f.bg.value).Available_Units+=+f.qty.value;   // inventory auto-update
    save();toast(`Collected ${f.qty.value} unit(s) of ${f.bg.value}. Inventory updated ✔`);collection();
  };
}
function table(head,rows){
  return `<div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${
    rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">No records</td></tr>`}</tbody></table></div>`;
}

/* ---------- Inventory ---------- */
function inventory(){
  const max=Math.max(10,...DB.inventory.map(i=>i.Available_Units));
  const total=DB.inventory.reduce((s,i)=>s+i.Available_Units,0);
  $('#view').innerHTML=`<div class="card" style="margin-bottom:18px"><b>Total available:</b> ${total} units
   &nbsp;·&nbsp; <small style="color:var(--muted)">Units below 3 are flagged as low stock. Stock changes automatically with collection and issue.</small></div>
   <div class="grid bags">${DB.inventory.map(i=>`<div class="bag ${i.Available_Units<3?'low':''}">
     ${i.Available_Units<3?'<span class="tag">LOW</span>':''}
     <div class="type">${i.Blood_Group}</div><div class="units">${i.Available_Units}</div><small>units available</small>
     <div class="meter"><i style="width:${i.Available_Units/max*100}%"></i></div></div>`).join('')}</div>`;
}

/* ---------- Requests ---------- */
function requests(){
  $('#view').innerHTML=`<div class="grid two">
  <div class="card"><h3>New Blood Request</h3><form id="f" novalidate>
    ${F('Patient / Hospital Name','pn',`<input name="pn" placeholder="Patient name">`)}
    ${F('Required Blood Group','bg',`<select name="bg">${groupOpts()}</select>`)}
    ${F('Quantity (units)','qty',`<input name="qty" type="number" min="1" value="1">`)}
    ${F('Request Date','date',`<input name="date" type="date" value="${today()}">`)}
    <div id="avail" style="margin-bottom:12px;font-size:13px;color:var(--muted)"></div>
    <button class="btn btn-primary btn-block">Submit Request</button></form></div>
  <div class="card"><h3>All Requests</h3><div class="toolbar"><select id="sf" class="search"><option value="">All statuses</option><option>Pending</option><option>Approved</option><option>Rejected</option><option>Issued</option></select></div><div id="rt"></div></div></div>`;
  const f=$('#f');
  f.bg.onchange=()=>{$('#avail').innerHTML=f.bg.value?`Currently available: <b>${stock(f.bg.value).Available_Units}</b> unit(s) of ${f.bg.value}`:''};
  f.onsubmit=e=>{
    e.preventDefault();
    if(!validate(f,{pn:v=>v.length<3?'Enter a valid name':'',bg:v=>!v?'Select blood group':'',qty:v=>+v<1?'Minimum 1 unit':'',date:v=>!v?'Select date':''}))return;
    DB.request.push({Request_ID:nextId('request','Request_ID'),Patient_Name:f.pn.value.trim(),Blood_Group:f.bg.value,Quantity:+f.qty.value,Request_Date:f.date.value,Status:'Pending'});
    save();toast('Request registered (Pending) ✔');requests();
  };
  const draw=()=>{
    const s=$('#sf').value;
    $('#rt').innerHTML=table(['ID','Patient','Group','Units','Date','Status','Actions'],
      [...DB.request].reverse().filter(r=>!s||r.Status===s).map(r=>[r.Request_ID,`<b>${esc(r.Patient_Name)}</b>`,`<span class="badge bg">${r.Blood_Group}</span>`,r.Quantity,r.Request_Date,statusBadge(r.Status),
        r.Status==='Pending'?`<div class="actions"><button class="btn btn-ok btn-sm" onclick="setStatus(${r.Request_ID},'Approved')">Approve</button><button class="btn btn-danger btn-sm" onclick="setStatus(${r.Request_ID},'Rejected')">Reject</button></div>`
        :r.Status==='Approved'?`<button class="btn btn-light btn-sm" onclick="go('issue')">Issue →</button>`:'—']));
  };
  $('#sf').onchange=draw;draw();
}
function setStatus(id,s){
  const r=DB.request.find(x=>x.Request_ID===id);
  if(s==='Approved'&&stock(r.Blood_Group).Available_Units<r.Quantity)toast(`Approved, but stock is currently short (${stock(r.Blood_Group).Available_Units} available)`,true);
  r.Status=s;save();if(s!=='Approved')toast(`Request ${s.toLowerCase()}`);else if(stock(r.Blood_Group).Available_Units>=r.Quantity)toast('Request approved ✔');
  requests();
}

/* ---------- Issue ---------- */
function issue(){
  const approved=DB.request.filter(r=>r.Status==='Approved');
  $('#view').innerHTML=`<div class="grid two">
  <div class="card"><h3>Issue Blood</h3>
   ${approved.length?`<form id="f" novalidate>
    ${F('Approved Request','req',`<select name="req"><option value="">Select request</option>${approved.map(r=>`<option value="${r.Request_ID}">#${r.Request_ID} · ${esc(r.Patient_Name)} · ${r.Quantity}u ${r.Blood_Group}</option>`).join('')}</select>`)}
    <div id="info" style="margin-bottom:14px;font-size:13.5px;color:var(--muted)">Select a request to check stock.</div>
    ${F('Issue Date','date',`<input name="date" type="date" value="${today()}">`)}
    <button class="btn btn-primary btn-block">Issue Blood</button></form>`
   :`<div class="empty">No approved requests waiting.<br><br><button class="btn btn-light" onclick="go('requests')">Go to Requests</button></div>`}</div>
  <div class="card"><h3>Issue History</h3>${table(['ID','Request','Group','Units','Date'],
    [...DB.issue].reverse().map(i=>[i.Issue_ID,'#'+i.Request_ID,`<span class="badge bg">${i.Blood_Group}</span>`,i.Quantity,i.Issue_Date]))}</div></div>`;
  const f=$('#f');if(!f)return;
  f.req.onchange=()=>{
    const r=DB.request.find(x=>x.Request_ID==f.req.value);
    $('#info').innerHTML=r?(stock(r.Blood_Group).Available_Units>=r.Quantity
      ?`✅ Stock OK: <b>${stock(r.Blood_Group).Available_Units}</b> available, <b>${r.Quantity}</b> needed`
      :`❌ Insufficient stock: only <b>${stock(r.Blood_Group).Available_Units}</b> available, <b>${r.Quantity}</b> needed`):'Select a request to check stock.';
  };
  f.onsubmit=e=>{
    e.preventDefault();
    if(!validate(f,{req:v=>!v?'Select a request':'',date:v=>!v?'Select date':''}))return;
    const r=DB.request.find(x=>x.Request_ID==f.req.value),s=stock(r.Blood_Group);
    if(s.Available_Units<r.Quantity)return toast('Insufficient stock to issue this request',true);
    s.Available_Units-=r.Quantity;
    r.Status='Issued';
    DB.issue.push({Issue_ID:nextId('issue','Issue_ID'),Request_ID:r.Request_ID,Blood_Group:r.Blood_Group,Quantity:r.Quantity,Issue_Date:f.date.value});
    save();toast(`Issued ${r.Quantity} unit(s) of ${r.Blood_Group}. Inventory updated ✔`);issue();
  };
}

/* ---------- Reports ---------- */
const REPORTS={
  donors:{label:'Donors',data:()=>DB.donor},
  collection:{label:'Collections',data:()=>DB.collection},
  inventory:{label:'Stock',data:()=>DB.inventory},
  request:{label:'Requests',data:()=>DB.request},
  issue:{label:'Issued',data:()=>DB.issue}
};
let rep='donors';
function reports(){
  $('#view').innerHTML=`<div class="tabs">${Object.entries(REPORTS).map(([k,v])=>`<button class="${k===rep?'on':''}" data-k="${k}">${v.label}</button>`).join('')}</div>
  <div class="card"><div class="toolbar no-print"><b style="flex:1" id="rtitle"></b>
   <button class="btn btn-light btn-sm" id="csv">⬇ Export CSV</button><button class="btn btn-light btn-sm" onclick="window.print()">🖨 Print</button></div><div id="rbody"></div></div>`;
  const draw=()=>{
    const data=REPORTS[rep].data();
    $('#rtitle').textContent=`${REPORTS[rep].label} Report (${data.length} records) · ${today()}`;
    $('#rbody').innerHTML=data.length?table(Object.keys(data[0]).map(k=>k.replace(/_/g,' ')),data.map(r=>Object.values(r).map(esc))):'<div class="empty">No records</div>';
  };
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{rep=b.dataset.k;reports()});
  $('#csv').onclick=()=>{const d=REPORTS[rep].data();if(!d.length)return toast('Nothing to export',true);download(`${rep}_report.csv`,toCSV(d))};
  draw();
}

/* ---------- Database ---------- */
function database(){
  $('#view').innerHTML=`
  <div class="grid stats">${[['Admin','admin'],['Donor','donor'],['Blood_Collection','collection'],['Blood_Inventory','inventory'],['Blood_Request','request'],['Blood_Issue','issue']]
    .map(([n,k])=>`<div class="stat"><div class="ico" style="background:#d6213a18">🗄️</div><div><h3>${DB[k].length}</h3><p>${n}</p></div></div>`).join('')}</div>
  <div class="card" style="margin-bottom:18px"><h3>Database Tools</h3><div class="toolbar">
    <button class="btn btn-light" id="bk">⬇ Backup (JSON)</button>
    <button class="btn btn-light" id="rs">⬆ Restore (JSON)</button>
    <button class="btn btn-danger" id="rst">♻ Reset to sample data</button>
    <input type="file" id="file" accept=".json" class="hidden"></div>
    <small style="color:var(--muted)">Data is saved in this browser (localStorage). Use Backup to keep a copy.</small></div>
  <div class="card"><div class="toolbar"><h3 style="flex:1;margin:0">MySQL Schema (from Chapter 2.3)</h3><button class="btn btn-light btn-sm" id="cp">📋 Copy SQL</button></div>
  <pre id="sql">${esc(SQL_SCHEMA)}</pre></div>`;
  $('#cp').onclick=()=>{navigator.clipboard?.writeText(SQL_SCHEMA).then(()=>toast('SQL copied ✔'),()=>toast('Copy failed',true))};
  $('#bk').onclick=()=>download('blood_bank_backup.json',JSON.stringify(DB,null,2),'application/json');
  $('#rs').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.donor||!d.inventory)throw 0;DB=d;save();toast('Database restored ✔');database()}catch(x){toast('Invalid backup file',true)}};
    r.readAsText(e.target.files[0]);
  };
  $('#rst').onclick=()=>confirmBox('This will erase all current data and load sample data. Continue?',()=>{DB=seed();save();toast('Database reset');database()});
}

/* =====================================================================
   AUTH, THEME, START
   ===================================================================== */
$('#loginForm').onsubmit=e=>{
  e.preventDefault();
  const u=$('#lu').value.trim(),p=$('#lp').value;
  if(DB.admin.some(a=>a.Username===u&&a.Password===p)){
    $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
    try{sessionStorage.setItem('sbbms_in','1')}catch(x){}
    go('dashboard');toast('Welcome, Administrator 👋');
  }else toast('Invalid username or password',true);
};
$('#logout').onclick=()=>{
  try{sessionStorage.removeItem('sbbms_in')}catch(x){}
  $('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#lp').value='';
};
$('#themeBtn').onclick=()=>{
  const dark=document.documentElement.dataset.theme!=='dark';
  document.documentElement.dataset.theme=dark?'dark':'light';
  $('#themeBtn').textContent=dark?'☀️':'🌙';
  try{localStorage.setItem('sbbms_theme',dark?'dark':'light')}catch(x){}
};
(function init(){
  try{
    if(localStorage.getItem('sbbms_theme')==='dark'){document.documentElement.dataset.theme='dark';$('#themeBtn').textContent='☀️'}
    if(sessionStorage.getItem('sbbms_in')){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');go('dashboard')}
  }catch(e){}
})();
</script>
</body>
</html>
